name: Build and push Docker images

# Full CI/CD: build-and-push builds both images and pushes them to Docker
# Hub on every push to main; deploy then SSHes into the EC2 box, pulls the
# fresh images, and restarts the stack. EC2_SSH_KEY is a deploy-only key
# generated specifically for this workflow (not the personal key used to
# administer the box directly) — see docs/DEPLOY.md for the reasoning.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY_IMAGE_WEB: ${{ secrets.DOCKERHUB_USERNAME }}/epfo-one-web
  REGISTRY_IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/epfo-one-api

jobs:
  # PRD §41 puts typecheck and tests ahead of the container build. Anything
  # that fails here must not reach Docker Hub, so build-and-push depends on
  # this job rather than running beside it.
  #
  # Lint is deliberately NOT a gate yet: `pnpm lint` currently fails on
  # pre-existing warnings and on packages/domain still carrying an ESLint 8
  # .eslintrc.cjs under ESLint 9. Adding it as a blocking step today would
  # only mean disabling it again; it belongs here once those are cleaned up.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup@v4 hard-errors
      # ("Multiple versions of pnpm specified") if a version is given both
      # here and via package.json's "packageManager" field. The latter
      # already pins pnpm@9.0.0, so that's the only source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          # Bake the deployed API origin into the client bundle at build
          # time (Next.js NEXT_PUBLIC_* convention) — see apps/web/Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY_IMAGE_WEB }}:latest
            ${{ env.REGISTRY_IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY_IMAGE_API }}:latest
            ${{ env.REGISTRY_IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull fresh images and restart the stack on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/epfo-one
            git pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            # The instance's disk is small (8GB) and every deploy leaves
            # the previous images' layers behind — ran out of space on a
            # real deploy once already. Prune anything not in use by a
            # running container, after the new stack is already up so
            # nothing active gets touched.
            docker image prune -a -f
            docker builder prune -a -f
